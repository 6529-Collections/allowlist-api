service: allowlist-api

package:
  excludeDevDependencies: true
  patterns:
    - 'dist/**'
    - 'migrations/**'
    - 'config/**'
    - '!src/**'
    - '!_templates/**'
    - '!.github/**'
    - '!coverage/**'
    - '!dockerfiles/**'
    - '!build-dev-db.sh'
    - '!docker-compose.yml'
    - '!node_modules/**/@types/**'
    - '!node_modules/**/*.d.ts'

provider:
  name: aws
  runtime: nodejs24.x
  region: us-east-1
  environment:
    ALLOWLIST_AWS_REGION: "us-east-1"
    SNS_TOPIC_ARN: "arn:aws:sns:us-east-1:987989283142:allowlist-creation.fifo"
    SNS_TOKEN_POOL_DOWNLOADER_TOPIC_ARN: "arn:aws:sns:us-east-1:987989283142:token-pool-downloader.fifo"
    SENTRY_DSN: ${env:SENTRY_DSN}
    SENTRY_ENV: production
  tracing:
    apiGateway: true
    lambda: true
  iamRoleStatements:
    - Effect: "Allow"
      Action:
        - "xray:PutTraceSegments"
        - "xray:PutTelemetryRecords"
      Resource:
        - "*"

functions:
  main:
    handler: dist/api-lambda.handler
    name: allowlist-api
    role: arn:aws:iam::987989283142:role/lambda-vpc-role
    vpc:
      securityGroupIds:
        - sg-033f6ed509ce4c3a4
        - sg-0b548abc33e4c84a3
      subnetIds:
        - subnet-08dbb020dea1a658d
        - subnet-003b0c8ce57cb67c2
    memorySize: 512
    timeout: 30
    events:
      - http:
          method: any
          path: /{any+}
          cors: true

  queue:
    handler: dist/worker-lambda.handler
    name: allowlist-worker
    role: arn:aws:iam::987989283142:role/lambda-vpc-role
    memorySize: 4086
    timeout: 900
    events:
      - sqs:
          arn: arn:aws:sqs:us-east-1:987989283142:allowlist-creation.fifo
          batchSize: 1
    vpc:
      securityGroupIds:
        - sg-033f6ed509ce4c3a4
        - sg-0b548abc33e4c84a3
      subnetIds:
        - subnet-08dbb020dea1a658d
        - subnet-003b0c8ce57cb67c2

  token-pool-downloader:
    handler: dist/token-pool-downloader-lambda.handler
    name: allowlist-token-pool-downloader
    role: arn:aws:iam::987989283142:role/lambda-vpc-role
    memorySize: 4086
    timeout: 900
    events:
      - sqs:
          arn: arn:aws:sqs:us-east-1:987989283142:token-pool-downloader.fifo
          batchSize: 1
    vpc:
      securityGroupIds:
        - sg-033f6ed509ce4c3a4
        - sg-0b548abc33e4c84a3
      subnetIds:
        - subnet-08dbb020dea1a658d
        - subnet-003b0c8ce57cb67c2
