name: Allowlist API Staging CI

on:
  workflow_dispatch:
    inputs:
      service:
        description: Deploy one service; run downloader, worker, then API in order
        required: true
        default: allowlist-token-pool-downloader
        type: choice
        options:
          - allowlist-token-pool-downloader
          - allowlist-worker
          - allowlist-api

concurrency:
  group: allowlist-staging-deploy
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}


jobs:
  build-test-and-deploy:
    name: Build, test and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: yarn
      - name: Enable Yarn
        run: corepack enable
      - name: Install dependencies
        run: yarn install --frozen-lockfile --registry=https://registry.npmjs.org/
      - name: Audit production dependencies
        run: yarn audit:production
      - name: Audit full dependency graph
        run: yarn audit:all
      - name: Build
        run: yarn build
      - name: Run unit tests
        run: yarn test
      - name: Test deployment selection
        run: node --test scripts/lambda-services.test.cjs
      - name: Inject Sentry source-map metadata
        run: yarn sentry:sourcemaps:inject
      - name: Package Lambdas
        run: yarn lambda:package
      - name: Verify Lambda artifact
        run: yarn lambda:package:verify
      - name: Upload Sentry source maps
        run: yarn sentry:sourcemaps:upload
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1
      - name: Deploy selected Lambda
        env:
          LAMBDA_SERVICE: ${{ inputs.service }}
        run: yarn lambda:deploy:staging "$LAMBDA_SERVICE"
      - name: Cold-start smoke test selected Lambda
        env:
          LAMBDA_SERVICE: ${{ inputs.service }}
        run: yarn lambda:smoke:staging "$LAMBDA_SERVICE"
      - name: Notify about failure
        uses: sarisia/actions-status-discord@v1
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          title: "Allowlist API staging CI pipeline is broken!!!"
          content: "@developers"
          color: 0xff0000
      - name: Notify about success
        uses: sarisia/actions-status-discord@v1
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          title: "New version of allowlist API is deployed to staging"
          color: 0x00ff00
